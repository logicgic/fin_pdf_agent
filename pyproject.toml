[project]
name = "fin-pdf-agent"
version = "0.1.0"
description = "Financial PDF analysis agent backend."
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.115.0",
    "markitdown[pdf]",
    "openai>=1.82.0",
    "openai-agents>=0.0.17",
    "python-dotenv>=1.1.1",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.34.0",
    "langfuse>=4.12.0",
    "logfire>=4.37.0",
    "uptrain>=0.7.1",
    "pandas>=3.0.3",
    "rouge-score>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
]

[tool.setuptools.packages.find]
include = ["fin_pdf_agent*"]

[tool.setuptools.package-data]
fin_pdf_agent = [
    "static/*",
    "core/resource/prompt/*",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
